name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sem paths no gatilho: checks condicionais ficam skipped, nunca pendentes.
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suite: ${{ steps.filtro.outputs.suite }}
      treino: ${{ steps.filtro.outputs.treino }}
      site: ${{ steps.filtro.outputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filtro
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          # Push compara com o commit anterior, nao apenas com a main.
          base: ${{ github.event.before || github.event.repository.default_branch }}
          filters: |
            suite:
              - 'draw/**'
              - 'tests/**'
              - 'tools/**'
              - 'main.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'models/MANIFEST.json'
              - '.github/workflows/**'
            treino:
              - 'training/**'
              - 'tests/test_train_init_checkpoint.py'
              - 'tests/test_train_pairing.py'
              - 'tests/test_train_init_checkpoint.py'
              - 'tests/test_efficiency_package.py'
              - 'tests/test_gen_synthetic.py'
              - 'tests/test_matformer.py'
              - 'tests/test_model_c_presence_hnbs.py'
              - 'tests/test_temporal_training.py'
              - 'tools/gen_synthetic.py'
              - 'tools/seg_metrics.py'
              - 'tools/validate_onnx.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'
            site:
              - 'site/**'
              - '.github/workflows/**'

  rapido:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Este subset so usa stdlib + pytest: sem OpenCV/ONNX/torch.
      - name: Dependencias leves
        run: python -m pip install 'pytest==9.2.0' 'ruff==0.17.4'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Contratos rapidos e puros
        run: >-
          pytest -q -m 'not lento'
          tests/test_falhas_doc.py tests/test_manifest.py tests/test_fetch_models.py

  suite:
    needs: mudancas
    if: needs.mudancas.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # opencv-contrib-python importa libGL.so.1 e libglib mesmo sem
      # abrir janela; sem estas libs a coleta da suite morre no import.
      - name: Dependencias de sistema do OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Dependencias Python
        run: python -m pip install -r requirements-dev.txt
      - name: Testes sem tempo real
        run: pytest -q -m 'not lento'
      - name: Testes de threads/tempo real (seriais)
        run: pytest -q -m lento
      - name: Selftest do pipeline (cena sintetica)
        run: python tests/selftest.py

  treino:
    needs: mudancas
    if: needs.mudancas.outputs.treino == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            training/requirements.txt
      - name: Dependencias de sistema do OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Torch CPU (runtime separado)
        run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      # Estes contratos precisam de transformers, mas nao do runtime
      # completo de acelerador nem de um segundo wheel de OpenCV.
      - name: Dependencias dos contratos de treino
        run: python -m pip install -r requirements-dev.txt 'transformers==5.22.2'
      - name: Exigir torch importavel (sem importorskip silencioso)
        run: python -c "import torch; print(torch.__version__)"
      - name: Seis arquivos de treino com torch
        run: >-
          pytest -q
          tests/test_train_init_checkpoint.py
          tests/test_train_pairing.py tests/test_efficiency_package.py
          tests/test_train_init_checkpoint.py
          tests/test_gen_synthetic.py tests/test_matformer.py
          tests/test_model_c_presence_hnbs.py tests/test_temporal_training.py

  site:
    needs: mudancas
    if: needs.mudancas.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  noturno:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            training/requirements.txt
      - name: Dependencias de sistema do OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Torch CPU (runtime separado)
        run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Dependencias Python e dos contratos de treino
        run: python -m pip install -r requirements-dev.txt 'transformers==5.22.2'
      - name: Exigir torch importavel
        run: python -c "import torch; print(torch.__version__)"
      - name: Suite completa (inclui treino e tempo real)
        run: pytest -q
      - name: Selftest do pipeline (cena sintetica)
        if: ${{ !cancelled() }}
        run: python tests/selftest.py
      - name: Regua sintetica de re-registro (so relatorio)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: python tools/replay_reregister.py --synthetic --strict --out replay-reregister.json
      - name: Publicar relatorio sintetico
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-reregister-py${{ matrix.python-version }}
          path: replay-reregister.json
          if-no-files-found: warn
