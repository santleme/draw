name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias headless e pytest
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "opencv-contrib-python-headless>=4.8" "onnxruntime>=1.17" pytest
      - name: Bateria completa (selftest + verificacao + contraprova + testes + tools)
        run: python tests/run_all.py
      - name: Pytest nos testes unitarios
        run: pytest tests/ -q
